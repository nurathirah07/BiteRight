<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiteRight - AI Powered Food Allergen Detector">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BiteRight">
  
  <!-- Theme color -->
  <meta name="theme-color" content="#FF9800">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Add CORS headers for API access -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' http://localhost:5000 ws://localhost:5000 ws://localhost:*;
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 http://10.0.2.2:5000 ws://localhost:* ws://127.0.0.1:*;
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data: https://fonts.gstatic.com;
  ">
  
  <!-- Load Google Fonts for better rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <title>BiteRight</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Ensure text is visible during webfont load */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FF9800, #F57C00);
    }
    
    /* Loading screen styles */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF9800, #F57C00);
      color: white;
      font-family: 'Roboto', sans-serif;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    .loading-content {
      text-align: center;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      margin: 20px auto;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Fallback for Material Icons */
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <!-- Loading indicator while Flutter initializes -->
  <div id="loading">
    <div class="loading-content">
      <div style="font-size: 48px; margin-bottom: 20px;">🍽️</div>
      <div style="font-size: 24px; margin-bottom: 10px;">BiteRight</div>
      <div style="font-size: 16px; opacity: 0.9;">Loading your food safety assistant...</div>
      <div class="loading-spinner"></div>
    </div>
  </div>
  
  <!-- This is the placeholder for the Flutter app -->
  <div id="flutter_target"></div>
  
  <!-- Flutter web engine script -->
  <script src="flutter.js" defer></script>
  
  <script>
    window.addEventListener('load', function() {
      // Configuration for Flutter web app
      const config = {
        serviceWorkerSettings: {
          url: "flutter_service_worker.js?v=" + Date.now(),
        },
        // Force canvas rendering if needed (helps with font issues)
        renderer: "canvaskit", // Use "html" for better font rendering or "canvaskit" for consistency
      };
      
      // Start the Flutter app
      _flutter.loader.loadEntrypoint({
        serviceWorker: config.serviceWorkerSettings,
        onEntrypointLoaded: async function(engineInitializer) {
          // Initialize engine with config
          const appRunner = await engineInitializer.initializeEngine(config);
          
          // Hide loading indicator
          document.getElementById('loading').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
          }, 500);
          
          // Run the app
          await appRunner.runApp();
        }
      }).catch((error) => {
        console.error('Failed to load Flutter:', error);
        document.getElementById('loading').innerHTML = `
          <div class="loading-content">
            <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
            <div style="font-size: 20px; margin-bottom: 10px;">Failed to load app</div>
            <div style="font-size: 14px; opacity: 0.8;">Please refresh the page</div>
            <div style="font-size: 12px; margin-top: 20px; color: #FFE0B2;">${error.message}</div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
